<!DOCTYPE html>
<html>
<head>
    <title>CFU Uncertainty Calculator</title>
    <style>
        /* Basic CSS for the sheet look */
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 600px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        input[type="number"] { width: 100px; }
        .log-col { background-color: #f0f0ff; }
        .result-col { font-weight: bold; background-color: #e0ffe0; }
    </style>
</head>
<body>
    <h1>Microbiology CFU Uncertainty Calculator</h1>

    <table>
        <thead>
            <tr>
                <th>CFU Count (N)</th>
                <th>log₁₀(N)</th>
                <th>Results</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" id="cfu1" value="105" oninput="calculate()"></td>
                <td id="log1" class="log-col"></td>
                <td>Mean log₁₀ (μlog)</td>
                <td id="mean_log" class="result-col"></td>
            </tr>
            <tr>
                <td><input type="number" id="cfu2" value="98" oninput="calculate()"></td>
                <td id="log2" class="log-col"></td>
                <td>Standard Deviation (Slog)</td>
                <td id="stdev_log" class="result-col"></td>
            </tr>
            <tr>
                <td><input type="number" id="cfu3" value="112" oninput="calculate()"></td>
                <td id="log3" class="log-col"></td>
                <td>Coverage Factor (k)</td>
                <td id="k_factor" class="result-col">2.00</td>
            </tr>
            <tr>
                <td><input type="number" id="cfu4" value="101" oninput="calculate()"></td>
                <td id="log4" class="log-col"></td>
                <td>Expanded Uncertainty (Ulog)</td>
                <td id="exp_uncert" class="result-col"></td>
            </tr>
            <tr>
                <td><input type="number" id="cfu5" value="96" oninput="calculate()"></td>
                <td id="log5" class="log-col"></td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td colspan="4" style="text-align: center; background-color: #ddd;">**CFU Scale Final Interval (95% CI)**</td>
            </tr>
            <tr>
                <td colspan="2"></td>
                <td>**Reported Mean CFU**</td>
                <td id="mean_cfu" class="result-col"></td>
            </tr>
            <tr>
                <td colspan="2"></td>
                <td>**Lower Limit (CFU)**</td>
                <td id="lower_limit" class="result-col"></td>
            </tr>
            <tr>
                <td colspan="2"></td>
                <td>**Upper Limit (CFU)**</td>
                <td id="upper_limit" class="result-col"></td>
            </tr>
        </tbody>
    </table>

    <script src="calculator.js"></script>
    <script>calculate();</script> </body>
</html>
